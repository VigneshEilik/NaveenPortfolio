<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Upper-case tokens wrapped in double underscores are filled from src/content/site.ts at build time. -->
    <title>__SITE_TITLE__</title>
    <meta name="description" content="__SITE_DESCRIPTION__" />
    <meta name="author" content="__PERSON_NAME__" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="__SITE_URL__/" />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="__THEME_LIGHT__" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="__THEME_DARK__" />
    <meta name="color-scheme" content="light dark" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Hero photo: preloaded for a fast Largest Contentful Paint -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/photos/hero-lake-1600.webp"
      imagesrcset="/images/photos/hero-lake-960.webp 960w, /images/photos/hero-lake-1600.webp 1600w, /images/photos/hero-lake-2400.webp 2400w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <!-- Open Graph (LinkedIn, WhatsApp, Facebook) -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="__PERSON_NAME__" />
    <meta property="og:title" content="__SITE_TITLE__" />
    <meta property="og:description" content="__SITE_DESCRIPTION__" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL____OG_IMAGE__" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="__SITE_TITLE__" />
    <meta property="og:locale" content="__LOCALE__" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__SITE_TITLE__" />
    <meta name="twitter:description" content="__SITE_DESCRIPTION__" />
    <meta name="twitter:image" content="__SITE_URL____OG_IMAGE__" />

    <!-- Structured data (JSON data block — not executed, so it is CSP-safe) -->
    <script type="application/ld+json">__JSON_LD__</script>

    <!-- Applies the saved/system theme before first paint (external file keeps CSP strict). -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <noscript>
      <p>
        This portfolio needs JavaScript enabled to display. Please enable it, or contact __PERSON_NAME__ via LinkedIn.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
