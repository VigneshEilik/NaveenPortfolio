<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#0a1633;font-family:'Segoe UI',Arial,sans-serif;color:#f6f2ea;position:relative}
  .glow{position:absolute;border-radius:50%;filter:blur(90px)}
  .wrap{position:absolute;inset:0;padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between}
  .chip{display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);border-radius:999px;padding:10px 20px;font-size:20px;color:rgba(255,255,255,.85)}
  .dot{width:10px;height:10px;border-radius:50%;background:#34d399}
  h1{font-size:92px;font-weight:700;margin:28px 0 0;letter-spacing:-3px;line-height:1}
  h2{font-size:36px;font-weight:500;margin:18px 0 0;color:#f4a259;font-family:Georgia,serif;font-style:italic}
  p{font-size:26px;color:rgba(246,242,234,.75);margin:22px 0 0;max-width:640px;line-height:1.35}
  .foot{font-size:22px;color:rgba(246,242,234,.6)}
  .photo{position:absolute;right:80px;top:96px;width:330px;height:410px;border-radius:36px;object-fit:cover;border:2px solid rgba(255,255,255,.3)}
</style></head><body>
<div class="glow" style="width:520px;height:520px;background:rgba(244,162,89,.35);right:-80px;top:-160px"></div>
<div class="glow" style="width:480px;height:480px;background:rgba(47,91,211,.4);left:-140px;bottom:-200px"></div>
<img class="photo" src="../../public/images/photos/portrait-720.webp" alt="">
<div class="wrap">
  <div>
    <span class="chip"><span class="dot"></span>MBA, Tourism Management</span>
    <h1>Naveenkumar M</h1>
    <h2>Tourism &amp; Travel Sales Professional</h2>
    <p>Holiday package sales · Group tour management · Itinerary planning · Vendor coordination</p>
  </div>
  <div class="foot">Karaikudi, Tamil Nadu · English &amp; Tamil</div>
</div>
</body></html>
